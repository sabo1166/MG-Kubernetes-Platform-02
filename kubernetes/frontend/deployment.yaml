apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mg-platform
  labels:
    app: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          # Replace <AWS_ACCOUNT_ID> and the tag (commit SHA) before applying.
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/mg-k8s-platform-02-frontend:REPLACE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom: { configMapKeyRef: { name: mg-platform-config, key: BACKEND_URL } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
