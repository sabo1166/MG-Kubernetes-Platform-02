# NodePort for initial access: http://<node-ip>:30080 (open the port in the node security group).
# Switch to ClusterIP once the Ingress stage is configured.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mg-platform
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
