name: docker-build

on:
  pull_request:
    paths: ["app/**", ".github/workflows/docker-build.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/docker-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONTEND_REPO: mg-k8s-platform-02-frontend
  BACKEND_REPO: mg-k8s-platform-02-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            app/backend/package-lock.json
            app/frontend/package-lock.json
      - name: Backend tests
        working-directory: app/backend
        run: |
          npm ci
          npm test
      - name: Frontend build
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t frontend:ci app/frontend
          docker build -t api:ci app/backend

      # Push only from main, after tests and builds succeeded.
      - name: Configure AWS credentials (static keys from GitHub Secrets)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push (commit SHA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          push_if_new() {
            local local_img=$1 repo=$2
            # Repositories use immutable tags: skip if this SHA was already pushed.
            if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$repo:$TAG already exists, skipping"
            else
              docker tag "$local_img" "$REGISTRY/$repo:$TAG"
              docker push "$REGISTRY/$repo:$TAG"
            fi
          }
          push_if_new frontend:ci "$FRONTEND_REPO"
          push_if_new api:ci "$BACKEND_REPO"
