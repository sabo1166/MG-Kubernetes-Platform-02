name: terraform-plan

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform-plan.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform-plan.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_DIR: terraform/environments/dev
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Configure AWS credentials (static keys from GitHub Secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init
        run: terraform init -input=false
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ env.TF_DIR }}

      # Plan only. Apply is never run from CI.
      # NOTE: state is local, so a CI plan always starts from empty state and shows all
      # resources as "to add". Migrate to remote state for meaningful plans.
      - name: Terraform plan
        run: terraform plan -input=false -no-color
        working-directory: ${{ env.TF_DIR }}
